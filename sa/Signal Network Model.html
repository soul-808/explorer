 if(s<.42){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`800 ${Math.max(13,Math.min(20,W/70))}px ${F}`;ctx.lineWidth=5;ctx.strokeStyle=C.bg;
  pods.forEach(p=>{const n=nodes[p.co],x=n.x*s+cam.x,y=(n.y-46)*s+cam.y;ctx.strokeText(p.name,x,y);ctx.fillStyle=p.key==='cards'?C.o:C.i;ctx.fillText(p.name,x,y)});
  if(s<.3)[['Citi',CX,10],['One Citi decision',CX,By+395]].forEach(([l,x,y])=>{const sx=x*s+cam.x,sy=y*s+cam.y;ctx.strokeText(l,sx,sy);ctx.fillStyle=C.i;ctx.fillText(l,sx,sy)})}
}
function frame(now){
 raf=null;const dt=Math.min(.05,(now-last)/1000);last=now;
 if(target){const k=1-Math.pow(.0015,dt);cam.s+=(target.s-cam.s)*k;cam.x+=(target.x-cam.x)*k;cam.y+=(target.y-cam.y)*k;if(Math.abs(target.s-cam.s)/target.s<.002){cam={...target};target=null}dirty=true}
 if(run&&!still){parts.forEach((p,i)=>{if(p.b===null){parts[i]=spawn(false);return}p.t+=dt*.8;if(p.t>=1){p.a=p.b;p.t=0;p.b=pick(p.a)}});dirty=true}
 if(dirty){draw();dirty=false}
 if((run&&!still)||target)kick();
}
function kick(){if(!raf)raf=requestAnimationFrame(t=>{if(!last)last=t;frame(t)})}
const redraw=()=>{dirty=true;kick()};
const bar=document.getElementById('bar');let lastPod='cards';
function setFocus(k){focus=k;bar.querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===k)))}
const zoomAt=(px,py,f)=>{target=null;const s=Math.max(fit().s*.7,Math.min(5,cam.s*f)),r=s/cam.s;cam.x=px-(px-cam.x)*r;cam.y=py-(py-cam.y)*r;cam.s=s;setFocus('');redraw()};
cv.addEventListener('wheel',e=>{e.preventDefault();const mouse=!e.ctrlKey&&e.deltaX===0&&Math.abs(e.deltaY)>=80;if(e.ctrlKey||mouse)zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0018)));else{target=null;cam.x-=e.deltaX;cam.y-=e.deltaY;setFocus('');redraw()}},{passive:false});
const pts=new Map();let pinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=0});
cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(pts.size===1){target=null;cam.x+=dx;cam.y+=dy;setFocus('');redraw()}
 else if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinch);pinch=d}});
const up=e=>{pts.delete(e.pointerId);pinch=0};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('dblclick',e=>zoomAt(e.clientX,e.clientY,2));
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='+'||e.key==='=')zoomAt(W/2,H/2,1.3);if(e.key==='-')zoomAt(W/2,H/2,.77);const m={ArrowLeft:[80,0],ArrowRight:[-80,0],ArrowUp:[0,80],ArrowDown:[0,-80]}[e.key];if(m){cam.x+=m[0];cam.y+=m[1];redraw()}});
const btns=[['all','All'],...pods.map(p=>[p.key,p.name]),['end','Citi decision']];
bar.innerHTML=btns.map(([k,n])=>`<button data-k="${k}" aria-pressed="${k==='all'}">${n}</button>`).join('')+'<span class="gap"></span><button id="lo">Second loop</button><button id="zo">Zoom out</button><button id="zi">Zoom in</button><button id="pp">Pause</button>';
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='zi')return zoomAt(W/2,H/2,1.5);if(b.id==='zo')return zoomAt(W/2,H/2,.67);
 if(b.id==='lo'){const p=pods.find(x=>x.key===lastPod);setFocus('');return go(view(p.x-20,p.y+1250,PW+40,740))}
 if(b.id==='pp'){run=!run;b.textContent=run?'Pause':'Play';kick();return}
 const k=b.dataset.k;setFocus(k);
 if(k==='all')go(fit());else if(k==='end')go(view(CX-1400,By-120,2800,1050));else{lastPod=k;const p=pods.find(x=>x.key===k);go(view(p.x-20,p.y-20,PW+40,1400))}});
if(still)document.getElementById('pp').hidden=true;
addEventListener('resize',()=>{size();if(focus==='all')cam=fit();redraw()});
size();cam=fit();for(let i=0;i<(W<700?260:520);i++)parts.push(spawn(true));
window.__sn={go:k=>bar.querySelector(`[data-k="${k}"]`).click()};
kick();if(document.fonts)document.fonts.ready.then(redraw);
})();
</script>
